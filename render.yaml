databases:
  - name: armorify_db
    databaseName: armorify_ppe
    user: admin

services:
  - type: web
    name: armorify-backend
    env: python
    rootDir: backend
    plan: free # Change to starter or standard as needed
    branch: main
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: armorify_db
          property: connectionString
      - key: DB_SCHEMA
        value: armorify
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        # Update this if your frontend gets a custom domain
        value: '["https://armorify-ppe.onrender.com"]'

  - type: web
    name: armorify-frontend
    env: docker
    rootDir: frontend
    plan: free # Change to starter or standard as needed
    branch: main
